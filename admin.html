<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة Future Sources</title><style>body{font-family:Tahoma,Arial;background:#f3f7f7;color:#15323a;margin:0}header{background:#102f39;color:white;padding:20px}main{max-width:750px;margin:auto;padding:16px}.card{background:white;padding:18px;border-radius:15px;margin:14px 0;box-shadow:0 2px 9px #0001}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 13px;border:1px solid #c7d6d6;border-radius:9px;font:inherit}button{background:#087e78;color:white;border:0;border-radius:9px;padding:11px 16px;font:inherit;cursor:pointer;margin:4px}button.alt{background:#dfeceb;color:#15323a}button.danger{background:#ad3343}.hidden{display:none}.item{border-bottom:1px solid #eee;padding:12px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#657d82;font-size:13px}.error{color:#a32c3b}label{font-weight:bold;font-size:14px}</style></head><body><header><h2>Future Sources | لوحة الإدارة</h2></header><main><div class="card"><p id="status">جارٍ الاتصال...</p><button id="login" class="hidden">تسجيل الدخول باستخدام Google</button><button id="logout" class="hidden alt">تسجيل الخروج</button></div><section id="admin" class="hidden"><div class="card"><h3 id="formTitle">إضافة منتج</h3><form id="form"><input type="hidden" id="docId"><label>اسم المنتج</label><input id="name" required maxlength="150"><label>التصنيف</label><input id="category" required placeholder="مثال: مجمدات"><label>السعر بالريال</label><input id="price" type="number" min="0" step="0.01" required><label>وحدة البيع</label><input id="unit" required placeholder="كرتون / كيلو / عبوة"><label>رابط صورة المنتج (اختياري)</label><input id="image" type="url" placeholder="https://..."><label>وصف المنتج</label><textarea id="description" rows="3"></textarea><label><input type="checkbox" id="active" checked style="width:auto"> عرض المنتج للعملاء</label><div><button type="submit" id="save">حفظ المنتج</button><button type="button" class="alt" id="reset">إلغاء التعديل</button></div></form></div><div class="card"><h3>المنتجات</h3><p id="msg" class="muted"></p><div id="list"></div></div></section><p class="muted">لا تشارك حساب Google أو كلمة المرور. تعديل البيانات متاح للحساب المصرح له فقط.</p></main><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const config={apiKey:"AIzaSyBapZgP0CPyOGDhNlHGb9jgSp865MIVoC0",authDomain:"future-sources.firebaseapp.com",projectId:"future-sources",storageBucket:"future-sources.firebasestorage.app",messagingSenderId:"314883727742",appId:"1:314883727742:web:5ec9e29a79be5d8a66d32f"};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider(),adminEmail="mohamed.yossef075@gmail.com";let rows=[],unsubscribe=null;
const $=id=>document.getElementById(id);const status=t=>$("status").textContent=t;const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("login").onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){if(e.code==="auth/popup-blocked")await signInWithRedirect(auth,provider);else status("تعذر الدخول: "+e.message)}};
$("logout").onclick=()=>signOut(auth);
getRedirectResult(auth).catch(e=>status("خطأ في تسجيل الدخول: "+e.message));
onAuthStateChanged(auth,user=>{if(unsubscribe){unsubscribe();unsubscribe=null}const ok=user?.email===adminEmail&&user.emailVerified;$("login").classList.toggle("hidden",!!user);$("logout").classList.toggle("hidden",!user);$("admin").classList.toggle("hidden",!ok);status(!user?"سجّل دخولك بحساب Google المعتمد.":ok?"تم تسجيل الدخول كمدير: "+user.email:"هذا الحساب غير مصرح له بإدارة المنتجات.");if(ok){unsubscribe=onSnapshot(collection(db,"products"),snap=>{rows=snap.docs.map(d=>({id:d.id,...d.data()}));draw();$("msg").textContent="عدد المنتجات: "+rows.length},e=>$("msg").textContent="خطأ في قراءة المنتجات: "+e.message)}});
function draw(){$("list").innerHTML=rows.map(p=>'<div class="item"><div><strong>'+esc(p.name)+'</strong><div class="muted">'+esc(p.category)+' | '+esc(p.price)+' ر.س / '+esc(p.unit)+' | '+(p.active?'ظاهر':'مخفي')+'</div></div><div><button class="alt" data-edit="'+esc(p.id)+'">تعديل</button><button class="danger" data-delete="'+esc(p.id)+'">حذف</button></div></div>').join("")||"لا توجد منتجات بعد."}
$("list").onclick=async e=>{const edit=e.target.closest("[data-edit]"),del=e.target.closest("[data-delete]");if(edit){const p=rows.find(x=>x.id===edit.dataset.edit);if(!p)return;for(const k of ["name","category","price","unit","image","description"])$(k).value=p[k]??"";$("active").checked=p.active===true;$("docId").value=p.id;$("formTitle").textContent="تعديل المنتج";window.scrollTo({top:0,behavior:"smooth"})}if(del){const p=rows.find(x=>x.id===del.dataset.delete);if(p&&confirm("هل تريد حذف "+p.name+" نهائيًا؟"))try{await deleteDoc(doc(db,"products",p.id))}catch(err){alert(err.message)}}};
$("reset").onclick=()=>{$("form").reset();$("docId").value="";$("formTitle").textContent="إضافة منتج"};
$("form").onsubmit=async e=>{e.preventDefault();$("save").disabled=true;const data={name:$("name").value.trim(),category:$("category").value.trim(),price:Number($("price").value),unit:$("unit").value.trim(),image:$("image").value.trim(),description:$("description").value.trim(),active:$("active").checked,updatedAt:serverTimestamp()};try{if($("docId").value)await updateDoc(doc(db,"products",$("docId").value),data);else await addDoc(collection(db,"products"),{...data,createdAt:serverTimestamp()});$("reset").click();$("msg").textContent="تم حفظ المنتج بنجاح"}catch(err){alert("تعذر الحفظ: "+err.message)}finally{$("save").disabled=false}};
</script></body></html>
