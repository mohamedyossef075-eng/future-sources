<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102f39"><title>Future Sources | كتالوج وطلبات</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f7;color:#18343d;font-family:Tahoma,Arial,sans-serif}header{background:#102f39;color:white;padding:20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}header b{font-size:23px}header b span{color:#51d6bc}button{cursor:pointer;font:inherit;border:0;border-radius:10px;padding:12px}header button,.action{background:#07867c;color:white;font-weight:bold}main{max-width:1080px;margin:auto;padding:18px}.hero{background:linear-gradient(120deg,#102f39,#087b77);color:white;border-radius:20px;padding:32px 25px}.hero h1{margin:0 0 12px}.hero p{line-height:1.9}.notice{background:#fff4d8;color:#73520d;padding:13px;border-radius:10px;margin:18px 0;line-height:1.8}input,textarea{font:inherit;padding:12px;border:1px solid #cedcdc;border-radius:9px;width:100%}.filters{display:flex;gap:8px;overflow:auto;margin:14px 0}.filters button{white-space:nowrap;background:white;border:1px solid #b9d0d0}.filters button.on{background:#102f39;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.product{background:white;border:1px solid #e0e9e9;border-radius:16px;overflow:hidden}.emoji{height:130px;display:grid;place-items:center;background:#e5f1ef;font-size:60px}.info{padding:16px}.info h3{margin:0}.info p{color:#687b80;min-height:35px;font-size:13px;line-height:1.7}.price{font-size:19px;font-weight:bold;color:#087b77}.info button{width:100%;margin-top:12px}.small{background:#edf6f5;color:#087b77}.overlay{position:fixed;inset:0;background:#0008;display:none;z-index:5}.overlay.show{display:block}.panel{background:white;position:absolute;left:0;top:0;bottom:0;overflow:auto;width:min(450px,100%);padding:20px}.item{padding:13px 0;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;gap:8px}.item button{background:#e7f1f0;padding:7px 12px}.panel input,.panel textarea{margin:8px 0}.panel .action{width:100%;margin:8px 0}footer{text-align:center;color:#7b8c90;padding:30px}@media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.emoji{height:90px;font-size:45px}.info{padding:11px}.info h3{font-size:14px}.info p{font-size:12px}.price{font-size:15px}.hero{padding:25px 18px}header b{font-size:19px}}</style></head><body><header><b>Future <span>Sources</span></b><button onclick="openCart()">🛒 الطلبية (<span id="count">0</span>)</button></header><main><section class="hero"><h1>منتجات غذائية لعملك</h1><p>استكشف المنتجات، حدد الكميات، وابعث طلبك مباشرة على واتساب الشركة. للطلبات الكبيرة اطلب عرض سعر خاص.</p></section><div class="notice">الأسعار والمنتجات المعروضة قابلة للتحديث، ويخضع قبول الطلب لتأكيد الشركة.</div><p id="loading">جارٍ تحميل المنتجات...</p><input id="search" placeholder="ابحث عن منتج..." oninput="render()"><div class="filters" id="filters"></div><div class="grid" id="grid"></div></main><div class="overlay" id="overlay" onclick="if(event.target===this)closeCart()"><div class="panel"><button onclick="closeCart()">✕ إغلاق</button><h2>طلبك</h2><div id="items"></div><p id="total"></p><input id="customer" placeholder="اسم العميل / المنشأة"><input id="city" placeholder="المدينة / عنوان التسليم"><textarea id="notes" rows="3" placeholder="ملاحظات إضافية"></textarea><button class="action" onclick="send(false)">إرسال الطلب عبر واتساب</button><button class="small" style="width:100%" onclick="send(true)">طلب عرض سعر للكميات الكبيرة</button></div></div><footer>Future Sources © 2026</footer><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getFirestore,collection,query,where,onSnapshot} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const config={apiKey:"AIzaSyBapZgP0CPyOGDhNlHGb9jgSp865MIVoC0",authDomain:"future-sources.firebaseapp.com",projectId:"future-sources",storageBucket:"future-sources.firebasestorage.app",messagingSenderId:"314883727742",appId:"1:314883727742:web:5ec9e29a79be5d8a66d32f"};
const db=getFirestore(initializeApp(config)),phone="966545081074";let products=[],cat="الكل",cart={};
const $=id=>document.getElementById(id),escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>Number(n).toLocaleString("ar-SA",{maximumFractionDigits:2});
function render(){let cats=["الكل",...new Set(products.map(p=>p.category))];if(!cats.includes(cat))cat="الكل";$("filters").replaceChildren();cats.forEach(c=>{const b=document.createElement("button");b.textContent=c;b.className=cat===c?"on":"";b.onclick=()=>{cat=c;render()};$("filters").append(b)});let q=$("search").value.trim();$("grid").replaceChildren();let visible=products.filter(p=>(cat==="الكل"||p.category===cat)&&p.name.includes(q));if(!visible.length){$("grid").textContent=products.length?"لا توجد نتائج مطابقة":"لا توجد منتجات معروضة حاليًا";return}visible.forEach(p=>{let article=document.createElement("article");article.className="product";let visual=document.createElement("div");visual.className="emoji";if(p.image&&/^https:\/\//i.test(p.image)){let img=document.createElement("img");img.src=p.image;img.alt=p.name;img.loading="lazy";img.style.cssText="width:100%;height:100%;object-fit:contain";visual.append(img)}else visual.textContent="📦";let info=document.createElement("div");info.className="info";let name=document.createElement("h3");name.textContent=p.name;let desc=document.createElement("p");desc.textContent=[p.unit,p.description].filter(Boolean).join(" — ");let price=document.createElement("div");price.className="price";price.textContent=money(p.price)+" ر.س";let add=document.createElement("button");add.className="action";add.textContent="+ أضف للطلب";add.onclick=()=>addProduct(p.id);let quote=document.createElement("button");quote.className="small";quote.textContent="طلب سعر جملة";quote.onclick=()=>wa("مرحبًا Future Sources، أريد عرض سعر جملة لمنتج: "+p.name);info.append(name,desc,price,add,quote);article.append(visual,info);$("grid").append(article)})}
function updateCount(){$("count").textContent=Object.values(cart).reduce((a,b)=>a+b,0)}function addProduct(id){cart[id]=(cart[id]||0)+1;updateCount()}function openCart(){$("overlay").classList.add("show");renderCart()}function closeCart(){$("overlay").classList.remove("show")}function change(id,n){cart[id]=Math.max(0,(cart[id]||0)+n);if(!cart[id])delete cart[id];updateCount();renderCart()}
function renderCart(){$("items").replaceChildren();let sum=0;for(const [id,qty] of Object.entries(cart)){let p=products.find(x=>x.id===id);if(!p)continue;sum+=p.price*qty;let row=document.createElement("div");row.className="item";let name=document.createElement("span");name.textContent=p.name;let actions=document.createElement("span");let minus=document.createElement("button");minus.textContent="−";minus.onclick=()=>change(id,-1);let plus=document.createElement("button");plus.textContent="+";plus.onclick=()=>change(id,1);actions.append(minus,document.createTextNode(" "+qty+" "),plus);row.append(name,actions);$("items").append(row)}if(!$("items").children.length)$("items").textContent="السلة فارغة";$("total").textContent="الإجمالي التقديري: "+money(sum)+" ر.س"}
function wa(s){window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(s),"_blank")}function send(isQuote){let lines=Object.entries(cart).map(([id,qty])=>({p:products.find(x=>x.id===id),qty})).filter(x=>x.p);if(!lines.length){alert("أضف منتجًا أولًا");return}let msg=(isQuote?"طلب عرض سعر للكميات الكبيرة":"طلب منتجات جديد")+" - Future Sources\n"+lines.map(({p,qty})=>"• "+p.name+" × "+qty+" "+p.unit).join("\n")+"\nالعميل: "+$("customer").value+"\nالمدينة: "+$("city").value+"\nملاحظات: "+$("notes").value+"\nالأسعار والتوافر بحاجة إلى تأكيد الشركة.";wa(msg)}
window.openCart=openCart;window.closeCart=closeCart;window.send=send;window.render=render;
onSnapshot(query(collection(db,"products"),where("active","==",true)),snap=>{products=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.sortOrder??999)-(b.sortOrder??999));for(let id of Object.keys(cart))if(!products.some(p=>p.id===id))delete cart[id];updateCount();$("loading").textContent=products.length?"المنتجات المتاحة: "+products.length:"الكتالوج قيد التجهيز، تابعنا قريبًا.";render()},e=>{$("loading").textContent="تعذر تحميل المنتجات، حاول تحديث الصفحة.";console.error(e)});
</script></body></html>
